name: Casa
description: 'Casa is a home management membership service that helps homeowners
  handle maintenance and everyday household tasks through a mix of digital home
  documentation and professional services. A $199/month membership bundles a
  concierge for project research, vendor negotiation and scheduling, monthly
  handyman hours, an Autopilot maintenance care plan, a 3D home inventory
  (appliances, paint colors, safety systems), utility and property-tax tracking,
  package handling, and recurring-vendor management. Casa is available in the San
  Francisco Bay Area, Los Angeles, and Austin, and is backed by Forerunner
  Ventures and True Ventures. No public developer/API surface has been identified.'
